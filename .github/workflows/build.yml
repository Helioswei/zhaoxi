name: build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  pull_request:
  tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.3'
  JAVA_VERSION: '21'

jobs:
  # ---------------------------------------------------------------- Android
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      # flutter test 用 NativeDatabase.memory()，需要系统 libsqlite3
      - name: Install libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      # 用与本地相同的 debug.keystore 签名，保证 APK 可以「原地升级」
      # 没配置 secret 时会生成新密钥，安装时需先卸载旧版（会丢数据）
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "keystore: restored"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 未配置，本次签名与本地不同，安装前需卸载旧版"
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Zip .app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app zhaoxi-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: app/build/macos/Build/Products/Release/zhaoxi-macos.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  # 打 tag（v*）时，自动把 APK / macOS 包挂到 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/android-apk/*.apk
            dist/macos-app/*.zip
          generate_release_notes: true
